<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, monospace">
  <rect width="720" height="240" rx="10" fill="#1E1E2E"/>
  <rect width="720" height="35" rx="10" fill="#16161E"/>
  <rect y="25" width="720" height="10" fill="#16161E"/>
  <rect x="0" y="0" width="160" height="3" fill="#2ECC71"/>
  <text x="14" y="24" fill="#D4D4D4" font-size="12">NewQuery.sql</text>

  <!-- Code lines - user typed -->
  <text x="14" y="60" fill="#5C6370" font-size="13">1</text>
  <text x="40" y="60" fill="#C678DD" font-size="13" font-weight="bold">SELECT</text>
  <text x="100" y="60" fill="#D4D4D4" font-size="13"> c.CustomerName,</text>

  <text x="14" y="82" fill="#5C6370" font-size="13">2</text>
  <text x="40" y="82" fill="#D4D4D4" font-size="13">       c.Email,</text>

  <text x="14" y="104" fill="#5C6370" font-size="13">3</text>
  <text x="40" y="104" fill="#D4D4D4" font-size="13">       </text>
  <text x="90" y="104" fill="#61AFEF" font-size="13">COUNT</text>
  <text x="135" y="104" fill="#D4D4D4" font-size="13">(o.OrderID)</text>
  <!-- cursor -->
  <rect x="225" y="92" width="2" height="16" fill="#4F8CFF">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Ghost text (AI prediction) - dimmed -->
  <text x="230" y="104" fill="#5C6370" font-size="13" opacity="0.55"> AS OrderCount</text>
  <text x="40" y="122" fill="#5C6370" font-size="13" opacity="0.55">FROM dbo.Customers c</text>
  <text x="40" y="140" fill="#5C6370" font-size="13" opacity="0.55">INNER JOIN dbo.Orders o</text>
  <text x="40" y="158" fill="#5C6370" font-size="13" opacity="0.55">    ON c.CustomerID = o.CustomerID</text>
  <text x="40" y="176" fill="#5C6370" font-size="13" opacity="0.55">GROUP BY c.CustomerName, c.Email</text>

  <!-- Label indicator -->
  <rect x="580" y="94" width="120" height="20" rx="4" fill="rgba(244,114,182,0.1)" stroke="rgba(244,114,182,0.3)" stroke-width="1"/>
  <text x="590" y="108" fill="#F472B6" font-size="9" font-weight="bold" font-family="Arial, sans-serif">🤖 AI Suggestion</text>

  <!-- Bottom info -->
  <rect x="10" y="195" width="700" height="35" rx="6" fill="#141820"/>
  <text x="20" y="216" fill="#5C6370" font-size="10" font-family="Arial, sans-serif">
    <tspan fill="#F472B6" font-weight="bold">Ghost text color:</tspan>
    <tspan> Light theme=#C0C0C0 | Dark theme=#5C6370 (opacity ~55%)</tspan>
    <tspan fill="#F472B6" font-weight="bold">  |  Accept:</tspan>
    <tspan> Tab</tspan>
    <tspan fill="#F472B6" font-weight="bold">  |  Dismiss:</tspan>
    <tspan> Any keypress</tspan>
    <tspan fill="#F472B6" font-weight="bold">  |  Manual:</tspan>
    <tspan> Ctrl+Alt+↑</tspan>
  </text>
</svg>