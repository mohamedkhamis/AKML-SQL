  </g>

  <!-- Status bar -->
  <rect y="385" width="720" height="35" rx="0" fill="#2ECC71"/>
  <rect y="385" width="720" height="35" fill="#2ECC71"/>
  <rect x="0" y="410" width="720" height="10" rx="0" ry="10" fill="#2ECC71"/>
  <text x="14" y="407" fill="#FFFFFF" font-size="12" font-weight="bold">🟢 DEV — localhost\SQL2022</text>
  <text x="580" y="407" fill="#FFFFFF" font-size="12">AdventureWorks</text>
  
  <!-- Label -->
  <text x="360" y="395" fill="#FFFFFF" font-size="9" text-anchor="middle" font-family="Arial, sans-serif">DEVELOPMENT ENVIRONMENT</text>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.4"/>
    </filter>
  </defs>
