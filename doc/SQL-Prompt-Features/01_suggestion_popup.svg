    <rect x="14" y="10" width="18" height="18" rx="4" fill="rgba(229,192,75,0.2)"/>
    <text x="19" y="24" fill="#E5C04B" font-size="10" font-weight="bold">T</text>
    <text x="40" y="24" fill="#E8EAF0" font-size="13">Categories</text>
    <text x="260" y="24" fill="#5C6370" font-size="10">Table</text>

    <!-- Item 2 -->
    <rect x="4" y="36" width="312" height="30" rx="4" fill="transparent"/>
    <rect x="14" y="42" width="18" height="18" rx="4" fill="rgba(229,192,75,0.2)"/>
