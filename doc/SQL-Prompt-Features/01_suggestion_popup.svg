  <rect x="0" y="3" width="160" height="32" fill="#1E1E2E"/>
  <text x="14" y="24" fill="#D4D4D4" font-size="12">Query1.sql</text>
  <text x="170" y="24" fill="#5C6370" font-size="12">Migration.sql</text>
  <rect x="170" y="0" width="140" height="3" rx="2" fill="#3498DB"/>

  <!-- Code Area -->
  <!-- Line numbers -->
  <text x="14" y="65" fill="#5C6370" font-size="13">1</text>
  <text x="14" y="85" fill="#5C6370" font-size="13">2</text>
  <text x="14" y="105" fill="#5C6370" font-size="13">3</text>

  <!-- SQL Code -->
  <text x="40" y="65" fill="#C678DD" font-size="13" font-weight="bold">SELECT</text>
  <text x="105" y="65" fill="#D4D4D4" font-size="13"> p.ProductName, p.UnitPrice</text>
  <text x="40" y="85" fill="#C678DD" font-size="13" font-weight="bold">FROM</text>
  <text x="82" y="85" fill="#E5C07B" font-size="13"> dbo.Products</text>
  <text x="185" y="85" fill="#D4D4D4" font-size="13"> p</text>
  <text x="40" y="105" fill="#C678DD" font-size="13" font-weight="bold">INNER JOIN</text>
  <text x="135" y="105" fill="#E5C07B" font-size="13"> dbo.</text>
  <!-- Cursor -->
