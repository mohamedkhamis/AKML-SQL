    <text x="40" y="152" fill="#8892A8" font-size="13">CustOrderHist</text>
    <text x="260" y="152" fill="#5C6370" font-size="10">Proc</text>

    <!-- Item 6 - Function -->
    <rect x="4" y="164" width="312" height="30" rx="4" fill="transparent"/>
    <rect x="14" y="170" width="18" height="18" rx="4" fill="rgba(209,154,102,0.2)"/>
    <text x="19" y="184" fill="#D19A66" font-size="10" font-weight="bold">F</text>
    <text x="40" y="184" fill="#8892A8" font-size="13">fn_GetTotal</text>
    <text x="260" y="184" fill="#5C6370" font-size="10">Function</text>
