    <rect x="14" y="74" width="18" height="18" rx="4" fill="rgba(229,192,75,0.2)"/>
    <text x="19" y="88" fill="#E5C04B" font-size="10" font-weight="bold">T</text>
    <text x="40" y="88" fill="#8892A8" font-size="13">OrderDetails</text>
    <text x="260" y="88" fill="#5C6370" font-size="10">Table</text>

    <!-- Item 4 -->
    <rect x="4" y="100" width="312" height="30" rx="4" fill="transparent"/>
    <rect x="14" y="106" width="18" height="18" rx="4" fill="rgba(229,192,75,0.2)"/>
    <text x="19" y="120" fill="#E5C04B" font-size="10" font-weight="bold">T</text>
    <text x="40" y="120" fill="#8892A8" font-size="13">Orders</text>
    <text x="260" y="120" fill="#5C6370" font-size="10">Table</text>

