    <text x="14" y="20" fill="#4F8CFF" font-size="11" font-weight="bold">Summary</text>
    <text x="85" y="20" fill="#5C6370" font-size="11">Script</text>
    <line x1="14" y1="26" x2="68" y2="26" stroke="#4F8CFF" stroke-width="2"/>
    <!-- Columns -->
    <text x="14" y="45" fill="#5C6370" font-size="9">COLUMN</text>
    <text x="110" y="45" fill="#5C6370" font-size="9">TYPE</text>
    <text x="14" y="62" fill="#D4D4D4" font-size="10">🔑 CategoryID</text>
    <text x="110" y="62" fill="#8892A8" font-size="10">int</text>
    <text x="14" y="78" fill="#D4D4D4" font-size="10">   CategoryName</text>
    <text x="110" y="78" fill="#8892A8" font-size="10">nvarchar(15)</text>
