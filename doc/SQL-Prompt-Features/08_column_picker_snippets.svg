<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="720" height="260" rx="10" fill="#0C0F14"/>

  <!-- Column Picker -->
  <g transform="translate(10, 10)">
    <text x="0" y="16" fill="#8892A8" font-size="11" font-weight="bold" letter-spacing="1">COLUMN PICKER</text>
    <rect x="0" y="24" width="250" height="220" rx="8" fill="#252836" stroke="#3A3F4E" stroke-width="1"/>
    
    <!-- Header -->
    <rect x="4" y="28" width="242" height="22" rx="4" fill="#1A1F2B"/>
    <text x="12" y="43" fill="#5C6370" font-size="9">dbo.Products — Select columns</text>
    <text x="192" y="43" fill="#4F8CFF" font-size="9" font-weight="bold">Select All</text>

    <!-- Rows -->
    <g font-family="Consolas, monospace" font-size="11">
      <!-- Checked -->
      <rect x="8" y="54" width="234" height="22" rx="3" fill="rgba(79,140,255,0.08)"/>
      <text x="14" y="69" fill="#4F8CFF">☑</text>
      <text x="32" y="69" fill="#D4D4D4">🔑 ProductID</text>
      <text x="160" y="69" fill="#5C6370" font-size="9">int, NOT NULL</text>

      <rect x="8" y="78" width="234" height="22" rx="3" fill="rgba(79,140,255,0.08)"/>
      <text x="14" y="93" fill="#4F8CFF">☑</text>
      <text x="32" y="93" fill="#D4D4D4">   ProductName</text>
      <text x="160" y="93" fill="#5C6370" font-size="9">nvarchar(40)</text>

      <!-- Unchecked -->
      <text x="14" y="117" fill="#5C6370">☐</text>
      <text x="32" y="117" fill="#8892A8">   SupplierID</text>
      <text x="160" y="117" fill="#5C6370" font-size="9">int, NULL</text>

      <rect x="8" y="126" width="234" height="22" rx="3" fill="rgba(79,140,255,0.08)"/>
      <text x="14" y="141" fill="#4F8CFF">☑</text>
      <text x="32" y="141" fill="#D4D4D4">🔗 CategoryID</text>
      <text x="160" y="141" fill="#5C6370" font-size="9">int, NULL (FK)</text>

      <rect x="8" y="150" width="234" height="22" rx="3" fill="rgba(79,140,255,0.08)"/>
      <text x="14" y="165" fill="#4F8CFF">☑</text>
      <text x="32" y="165" fill="#D4D4D4">   UnitPrice</text>
      <text x="160" y="165" fill="#5C6370" font-size="9">money, NULL</text>

      <text x="14" y="189" fill="#5C6370">☐</text>
      <text x="32" y="189" fill="#8892A8">   UnitsInStock</text>
      <text x="160" y="189" fill="#5C6370" font-size="9">smallint</text>

      <text x="14" y="213" fill="#5C6370">☐</text>
      <text x="32" y="213" fill="#8892A8">   Discontinued</text>
      <text x="160" y="213" fill="#5C6370" font-size="9">bit, NOT NULL</text>
    </g>

    <!-- Footer -->
    <text x="12" y="236" fill="#5C6370" font-size="9">Tab=toggle | Enter=confirm | Sort: Alphabetical ▾</text>
  </g>

  <!-- Snippet Manager -->
  <g transform="translate(280, 10)">
    <text x="0" y="16" fill="#8892A8" font-size="11" font-weight="bold" letter-spacing="1">SNIPPET MANAGER</text>
    <rect x="0" y="24" width="430" height="220" rx="8" fill="#252836" stroke="#3A3F4E" stroke-width="1"/>

    <!-- Snippet list (left) -->
    <rect x="4" y="28" width="150" height="212" rx="4" fill="#1A1F2B"/>
    <rect x="8" y="32" width="142" height="20" rx="3" fill="rgba(79,140,255,0.15)"/>
    <text x="14" y="46" fill="#4F8CFF" font-size="10" font-family="Consolas, monospace" font-weight="bold">ssf</text>
    <text x="36" y="46" fill="#D4D4D4" font-size="10">Select * From</text>

    <text x="14" y="66" fill="#3DD68C" font-size="10" font-family="Consolas, monospace" font-weight="bold">ii</text>
    <text x="30" y="66" fill="#8892A8" font-size="10">Insert Into</text>

    <text x="14" y="84" fill="#3DD68C" font-size="10" font-family="Consolas, monospace" font-weight="bold">w2</text>
    <text x="34" y="84" fill="#8892A8" font-size="10">sp_who2</text>

    <text x="14" y="102" fill="#3DD68C" font-size="10" font-family="Consolas, monospace" font-weight="bold">chk</text>
    <text x="38" y="102" fill="#8892A8" font-size="10">Check Stats</text>

    <text x="14" y="120" fill="#3DD68C" font-size="10" font-family="Consolas, monospace" font-weight="bold">timings</text>
    <text x="60" y="120" fill="#8892A8" font-size="10">Timing</text>

    <text x="14" y="138" fill="#3DD68C" font-size="10" font-family="Consolas, monospace" font-weight="bold">tc</text>
    <text x="30" y="138" fill="#8892A8" font-size="10">TRY/CATCH</text>

    <text x="14" y="156" fill="#3DD68C" font-size="10" font-family="Consolas, monospace" font-weight="bold">b</text>
    <text x="25" y="156" fill="#8892A8" font-size="10">BEGIN/END</text>

    <text x="14" y="174" fill="#3DD68C" font-size="10" font-family="Consolas, monospace" font-weight="bold">csp</text>
    <text x="38" y="174" fill="#8892A8" font-size="10">Create SP</text>

    <!-- Snippet body (right) -->
    <rect x="160" y="28" width="266" height="142" rx="4" fill="#0C0F14"/>
    <text font-family="Consolas, monospace" font-size="10">
      <tspan x="168" y="46" fill="#C678DD" font-weight="bold">SELECT</tspan>
      <tspan x="210" y="46" fill="#D4D4D4"> *</tspan>
      <tspan x="168" y="62" fill="#C678DD" font-weight="bold">FROM</tspan>
      <tspan x="200" y="62" fill="#D4D4D4"> $CURSOR$</tspan>
    </text>
    
    <text x="168" y="94" fill="#5C6370" font-size="9">PLACEHOLDERS:</text>
    <text x="168" y="110" fill="#FBBF24" font-size="9" font-family="Consolas, monospace">$CURSOR$</text>
    <text x="240" y="110" fill="#5C6370" font-size="9">Final cursor position</text>
    <text x="168" y="124" fill="#FBBF24" font-size="9" font-family="Consolas, monospace">$SELECTEDTEXT$</text>
    <text x="275" y="124" fill="#5C6370" font-size="9">Wrap selection</text>
    <text x="168" y="138" fill="#FBBF24" font-size="9" font-family="Consolas, monospace">$PASTE$</text>
    <text x="225" y="138" fill="#5C6370" font-size="9">Clipboard content</text>
    <text x="168" y="152" fill="#FBBF24" font-size="9" font-family="Consolas, monospace">$DATE$ $DBNAME$</text>
    <text x="288" y="152" fill="#5C6370" font-size="9">Date / DB name</text>

    <!-- Buttons -->
    <rect x="160" y="178" width="60" height="22" rx="4" fill="rgba(79,140,255,0.15)" stroke="rgba(79,140,255,0.3)" stroke-width="1"/>
    <text x="175" y="193" fill="#4F8CFF" font-size="9" font-weight="bold">New</text>
    <rect x="226" y="178" width="60" height="22" rx="4" fill="rgba(79,140,255,0.15)" stroke="rgba(79,140,255,0.3)" stroke-width="1"/>
    <text x="241" y="193" fill="#4F8CFF" font-size="9" font-weight="bold">Edit</text>
    <rect x="292" y="178" width="60" height="22" rx="4" fill="rgba(255,92,92,0.1)" stroke="rgba(255,92,92,0.2)" stroke-width="1"/>
    <text x="303" y="193" fill="#FF5C5C" font-size="9" font-weight="bold">Delete</text>
    <rect x="358" y="178" width="64" height="22" rx="4" fill="rgba(61,214,140,0.1)" stroke="rgba(61,214,140,0.2)" stroke-width="1"/>
    <text x="366" y="193" fill="#3DD68C" font-size="9" font-weight="bold">Export</text>

    <!-- Shared folder info -->
    <text x="160" y="224" fill="#5C6370" font-size="9">📁 Personal: ~\AppData\SQLPrompt\Snippets</text>
    <text x="160" y="238" fill="#5C6370" font-size="9">📁 Shared: \\network\shared\snippets (team sync)</text>
  </g>
</svg>