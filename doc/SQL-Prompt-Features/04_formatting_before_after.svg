<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, monospace">
  <rect width="720" height="300" rx="10" fill="#0C0F14"/>

  <!-- BEFORE box -->
  <g transform="translate(10, 10)">
    <text x="0" y="14" fill="#FF9F43" font-size="10" font-family="Arial, sans-serif" font-weight="bold" text-transform="uppercase" letter-spacing="2">BEFORE — UNFORMATTED</text>
    <rect x="0" y="22" width="330" height="80" rx="8" fill="#1E1E2E" stroke="#2A3040" stroke-width="1"/>
    <text x="10" y="42" fill="#C678DD" font-size="11">select</text>
    <text x="50" y="42" fill="#D4D4D4" font-size="11"> p.name,p.price,c.cat</text>
    <text x="10" y="58" fill="#D4D4D4" font-size="11">egoryname </text>
    <text x="83" y="58" fill="#C678DD" font-size="11">from</text>
    <text x="110" y="58" fill="#D4D4D4" font-size="11"> products p</text>
    <text x="10" y="74" fill="#C678DD" font-size="11">inner join</text>
    <text x="85" y="74" fill="#D4D4D4" font-size="11"> categories c</text>
    <text x="170" y="74" fill="#C678DD" font-size="11">on</text>
    <text x="183" y="74" fill="#D4D4D4" font-size="11"> p.catid=c.id</text>
    <text x="10" y="90" fill="#C678DD" font-size="11">where</text>
    <text x="43" y="90" fill="#D4D4D4" font-size="11"> p.price>10 </text>
    <text x="120" y="90" fill="#C678DD" font-size="11">order by</text>
    <text x="178" y="90" fill="#D4D4D4" font-size="11"> p.name</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(350, 55)">
    <text x="0" y="20" fill="#4F8CFF" font-size="28" font-family="Arial">→</text>
    <text x="0" y="42" fill="#4F8CFF" font-size="9" font-family="Arial, sans-serif">Ctrl+K, Y</text>
  </g>

  <!-- AFTER box -->
  <g transform="translate(380, 10)">
    <text x="0" y="14" fill="#3DD68C" font-size="10" font-family="Arial, sans-serif" font-weight="bold" text-transform="uppercase" letter-spacing="2">AFTER — FORMATTED</text>
    <rect x="0" y="22" width="330" height="130" rx="8" fill="#1E1E2E" stroke="#2A3040" stroke-width="1"/>
    <text x="10" y="42" fill="#C678DD" font-size="11" font-weight="bold">SELECT</text>
    <text x="62" y="42" fill="#D4D4D4" font-size="11"> p.Name,</text>
    <text x="62" y="58" fill="#D4D4D4" font-size="11">p.Price,</text>
    <text x="62" y="74" fill="#D4D4D4" font-size="11">c.CategoryName</text>
    <text x="10" y="90" fill="#C678DD" font-size="11" font-weight="bold">FROM</text>
    <text x="42" y="90" fill="#E5C07B" font-size="11"> dbo.Products</text>
    <text x="145" y="90" fill="#D4D4D4" font-size="11"> p</text>
    <text x="10" y="106" fill="#C678DD" font-size="11" font-weight="bold">INNER JOIN</text>
    <text x="100" y="106" fill="#E5C07B" font-size="11"> dbo.Categories</text>
    <text x="210" y="106" fill="#D4D4D4" font-size="11"> c</text>
    <text x="30" y="122" fill="#C678DD" font-size="11" font-weight="bold">ON</text>
    <text x="48" y="122" fill="#D4D4D4" font-size="11"> p.CategoryID = c.ID</text>
    <text x="10" y="138" fill="#C678DD" font-size="11" font-weight="bold">WHERE</text>
    <text x="52" y="138" fill="#D4D4D4" font-size="11"> p.Price > </text>
    <text x="120" y="138" fill="#D19A66" font-size="11">10</text>
  </g>

  <!-- Formatting Settings Summary -->
  <g transform="translate(10, 160)">
    <text x="0" y="0" fill="#8892A8" font-size="12" font-family="Arial, sans-serif" font-weight="bold">KEY FORMATTING STYLE SETTINGS</text>
    <g transform="translate(0, 14)" font-family="Arial, sans-serif" font-size="10">
      <rect x="0" y="0" width="340" height="22" rx="4" fill="#141820"/>
      <text x="8" y="15" fill="#A78BFA">Casing:</text>
      <text x="55" y="15" fill="#8892A8">Keywords=UPPER | Types=lower | Functions=UPPER</text>

      <rect x="0" y="26" width="340" height="22" rx="4" fill="#141820"/>
      <text x="8" y="41" fill="#A78BFA">Commas:</text>
      <text x="60" y="41" fill="#8892A8">Trailing (end of line) | Space after=On</text>

      <rect x="0" y="52" width="340" height="22" rx="4" fill="#141820"/>
      <text x="8" y="67" fill="#A78BFA">Indent:</text>
      <text x="52" y="67" fill="#8892A8">4 spaces | Tabs=Off | Wrap at 80 chars</text>

      <rect x="350" y="0" width="340" height="22" rx="4" fill="#141820"/>
      <text x="358" y="15" fill="#A78BFA">Parens:</text>
      <text x="405" y="15" fill="#8892A8">Same line | Collapse if short (&lt;35) = On</text>

      <rect x="350" y="26" width="340" height="22" rx="4" fill="#141820"/>
      <text x="358" y="41" fill="#A78BFA">JOINs:</text>
      <text x="400" y="41" fill="#8892A8">Keyword align=To table | ON=new line</text>

      <rect x="350" y="52" width="340" height="22" rx="4" fill="#141820"/>
      <text x="358" y="67" fill="#A78BFA">Align:</text>
      <text x="398" y="67" fill="#8892A8">Across clauses=Off | Aliases=Off</text>
    </g>

    <text x="0" y="104" fill="#5C6370" font-size="9" font-family="Arial, sans-serif">Style saved as .sqlpromptstyle JSON file — exportable, importable, shareable via Redgate Platform</text>
  </g>
</svg>