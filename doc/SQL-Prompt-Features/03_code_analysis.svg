<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, monospace">
  <rect width="720" height="380" rx="10" fill="#1E1E2E"/>
  <rect width="720" height="35" rx="10" fill="#16161E"/>
  <rect y="25" width="720" height="10" fill="#16161E"/>
  <rect x="0" y="0" width="160" height="3" fill="#2ECC71"/>
  <text x="14" y="24" fill="#D4D4D4" font-size="12">StoredProc.sql</text>

  <!-- Line numbers + Code -->
  <text x="14" y="60" fill="#5C6370" font-size="13">1</text>
  <text x="40" y="60" fill="#C678DD" font-size="13" font-weight="bold">CREATE PROCEDURE</text>
  <text x="220" y="60" fill="#61AFEF" font-size="13"> GetOrders</text>

  <text x="14" y="82" fill="#5C6370" font-size="13">2</text>
  <text x="40" y="82" fill="#C678DD" font-size="13" font-weight="bold">AS</text>

  <text x="14" y="104" fill="#5C6370" font-size="13">3</text>
  <text x="40" y="104" fill="#C678DD" font-size="13" font-weight="bold">SELECT</text>
  <text x="100" y="104" fill="#D4D4D4" font-size="13"> *</text>
  <!-- Wavy underline for * (green = warning) -->
  <path d="M100,109 q3,-3 6,0 t6,0 t6,0" stroke="#3DD68C" stroke-width="1.5" fill="none"/>
  <text x="130" y="104" fill="#6A9955" font-size="12" font-style="italic">-- ⚠ BP005: SELECT * used</text>

  <text x="14" y="126" fill="#5C6370" font-size="13">4</text>
  <text x="40" y="126" fill="#C678DD" font-size="13" font-weight="bold">FROM</text>
  <text x="82" y="126" fill="#E5C07B" font-size="13"> Orders</text>
  <!-- Wavy underline for Orders (green = warning) -->
  <path d="M82,131 q3,-3 6,0 t6,0 t6,0 t6,0 t6,0 t6,0" stroke="#3DD68C" stroke-width="1.5" fill="none"/>
  <text x="160" y="126" fill="#6A9955" font-size="12" font-style="italic">-- ⚠ PE002: Schema not specified</text>

  <text x="14" y="148" fill="#5C6370" font-size="13">5</text>
  <text x="40" y="148" fill="#C678DD" font-size="13" font-weight="bold">WHERE</text>
  <text x="90" y="148" fill="#D4D4D4" font-size="13"> OrderDate > </text>
  <text x="215" y="148" fill="#CE9178" font-size="13">'2024-01-01'</text>

  <text x="14" y="170" fill="#5C6370" font-size="13">6</text>
  <text x="40" y="170" fill="#C678DD" font-size="13" font-weight="bold">ORDER BY</text>
  <text x="120" y="170" fill="#D19A66" font-size="13"> 1</text>
  <!-- Wavy underline for 1 (green = warning) -->
  <path d="M120,175 q3,-3 6,0 t6,0" stroke="#3DD68C" stroke-width="1.5" fill="none"/>
  <text x="150" y="170" fill="#6A9955" font-size="12" font-style="italic">-- ⚠ BP015: ORDER BY ordinal</text>

  <!-- Lightbulb margin icons -->
  <text x="2" y="105" font-size="13">💡</text>
  <text x="2" y="127" font-size="13">💡</text>
  <text x="2" y="171" font-size="13">💡</text>

  <!-- Rule Category Legend -->
  <g transform="translate(30, 200)">
    <text x="0" y="0" fill="#8892A8" font-size="12" font-family="Arial, sans-serif" font-weight="bold">CODE ANALYSIS RULE CATEGORIES</text>
    
    <rect x="0" y="14" width="16" height="16" rx="3" fill="#4F8CFF"/>
    <text x="22" y="27" fill="#D4D4D4" font-size="11" font-family="Arial, sans-serif">BP — Best Practices</text>

    <rect x="180" y="14" width="16" height="16" rx="3" fill="#FF9F43"/>
    <text x="202" y="27" fill="#D4D4D4" font-size="11" font-family="Arial, sans-serif">PE — Performance</text>

    <rect x="360" y="14" width="16" height="16" rx="3" fill="#FF5C5C"/>
    <text x="382" y="27" fill="#D4D4D4" font-size="11" font-family="Arial, sans-serif">DEP — Deprecated</text>

    <rect x="530" y="14" width="16" height="16" rx="3" fill="#A78BFA"/>
    <text x="552" y="27" fill="#D4D4D4" font-size="11" font-family="Arial, sans-serif">ST — Style</text>

    <rect x="0" y="40" width="16" height="16" rx="3" fill="#FBBF24"/>
    <text x="22" y="53" fill="#D4D4D4" font-size="11" font-family="Arial, sans-serif">MI — Miscellaneous</text>

    <rect x="180" y="40" width="16" height="16" rx="3" fill="#22D3EE"/>
    <text x="202" y="53" fill="#D4D4D4" font-size="11" font-family="Arial, sans-serif">EI — Execution Issue</text>

    <rect x="360" y="40" width="16" height="16" rx="3" fill="#3DD68C"/>
    <text x="382" y="53" fill="#D4D4D4" font-size="11" font-family="Arial, sans-serif">SC — Source Control</text>

    <text x="0" y="82" fill="#5C6370" font-size="10" font-family="Arial, sans-serif">INDICATORS: 🟢 Green wavy underline = Warning | 🔴 Red wavy underline = Error | 💡 Lightbulb = Auto-fixable</text>
    <text x="0" y="96" fill="#5C6370" font-size="10" font-family="Arial, sans-serif">Each rule severity: Ignore / Warning / Error — configurable per rule in .casettings XML file</text>
  </g>

  <!-- Status bar -->
  <rect y="345" width="720" height="35" fill="#1A1F2B"/>
  <text x="14" y="368" fill="#FF9F43" font-size="12">⚠ 3 warnings</text>
  <text x="140" y="368" fill="#5C6370" font-size="12">|</text>
  <text x="155" y="368" fill="#3DD68C" font-size="12">0 errors</text>
  <text x="540" y="368" fill="#5C6370" font-size="12">Code Analysis: </text>
  <text x="648" y="368" fill="#3DD68C" font-size="12">ON</text>
</svg>