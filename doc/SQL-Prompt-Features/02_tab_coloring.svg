<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, monospace">
  <!-- Background -->
  <rect width="720" height="280" rx="10" fill="#1E1E2E"/>
  <!-- Tab bar -->
  <rect width="720" height="40" rx="10" fill="#16161E"/>
  <rect y="30" width="720" height="10" fill="#16161E"/>

  <!-- Tab 1: PRODUCTION (Red) -->
  <rect x="0" y="0" width="170" height="3" fill="#E74C3C"/>
  <rect x="0" y="3" width="170" height="37" fill="#2A1215" rx="0"/>
  <text x="10" y="26" fill="#FF6B6B" font-size="11">⚠ PROD_Fix.sql</text>
  <rect x="170" y="3" width="1" height="37" fill="#333"/>

  <!-- Tab 2: DEVELOPMENT (Green) - Active -->
  <rect x="171" y="0" width="170" height="3" fill="#2ECC71"/>
  <rect x="171" y="3" width="170" height="37" fill="#122A18"/>
  <text x="181" y="26" fill="#5FF5A0" font-size="11">Feature_Work.sql</text>
  <rect x="341" y="3" width="1" height="37" fill="#333"/>

  <!-- Tab 3: TESTING (Blue) -->
  <rect x="342" y="0" width="150" height="3" fill="#3498DB"/>
  <rect x="342" y="3" width="150" height="37" fill="#1A2230"/>
  <text x="352" y="26" fill="#5DADE2" font-size="11">TestQuery.sql</text>
  <rect x="492" y="3" width="1" height="37" fill="#333"/>

  <!-- Tab 4: STAGING (Orange) -->
  <rect x="493" y="0" width="165" height="3" fill="#F39C12"/>
  <rect x="493" y="3" width="165" height="37" fill="#2A2415"/>
  <text x="503" y="26" fill="#F5B041" font-size="11">Staging_Check.sql</text>
  <rect x="658" y="3" width="1" height="37" fill="#333"/>

  <!-- Tab 5: LOCAL (Gray) -->
  <rect x="659" y="0" width="61" height="3" fill="#95A5A6"/>
  <rect x="659" y="3" width="61" height="37" fill="#1A1D20"/>
  <text x="665" y="26" fill="#ABB2BF" font-size="11">Local</text>

  <!-- Code area -->
  <text x="25" y="70" fill="#5C6370" font-size="13">1</text>
  <text x="50" y="70" fill="#6A9955" font-size="13">-- Connected to DEV server — safe to experiment</text>
  <text x="25" y="92" fill="#5C6370" font-size="13">2</text>
  <text x="50" y="92" fill="#C678DD" font-size="13" font-weight="bold">ALTER TABLE</text>
  <text x="158" y="92" fill="#E5C07B" font-size="13"> dbo.Users</text>
  <text x="258" y="92" fill="#C678DD" font-size="13" font-weight="bold"> ADD</text>
  <text x="295" y="92" fill="#D4D4D4" font-size="13"> Email</text>
  <text x="345" y="92" fill="#61AFEF" font-size="13"> NVARCHAR</text>
  <text x="425" y="92" fill="#D4D4D4" font-size="13">(</text>
  <text x="433" y="92" fill="#D19A66" font-size="13">255</text>
  <text x="457" y="92" fill="#D4D4D4" font-size="13">);</text>

  <!-- Status bar with green Dev color -->
  <rect y="245" width="720" height="35" fill="#2ECC71"/>
  <rect x="0" y="270" width="720" height="10" rx="0" ry="10" fill="#2ECC71"/>
  <text x="14" y="268" fill="#FFFFFF" font-size="13" font-weight="bold">🟢 DEVELOPMENT — localhost\SQL2022</text>
  <text x="560" y="268" fill="#FFFFFF" font-size="13">AdventureWorks</text>

  <!-- Legend below -->
  <g transform="translate(40, 130)">
    <text x="0" y="0" fill="#8892A8" font-size="11" font-family="Arial, sans-serif" font-weight="bold">DEFAULT ENVIRONMENT COLORS:</text>
    <!-- Production -->
    <rect x="0" y="12" width="24" height="14" rx="3" fill="#E74C3C"/>
    <text x="30" y="24" fill="#D4D4D4" font-size="11" font-family="Arial, sans-serif">Production #E74C3C</text>
    <!-- Staging -->
    <rect x="190" y="12" width="24" height="14" rx="3" fill="#F39C12"/>
    <text x="220" y="24" fill="#D4D4D4" font-size="11" font-family="Arial, sans-serif">Staging #F39C12</text>
    <!-- Testing -->
    <rect x="370" y="12" width="24" height="14" rx="3" fill="#3498DB"/>
    <text x="400" y="24" fill="#D4D4D4" font-size="11" font-family="Arial, sans-serif">Testing #3498DB</text>
    <!-- Development -->
    <rect x="0" y="38" width="24" height="14" rx="3" fill="#2ECC71"/>
    <text x="30" y="50" fill="#D4D4D4" font-size="11" font-family="Arial, sans-serif">Development #2ECC71</text>
    <!-- Local -->
    <rect x="190" y="38" width="24" height="14" rx="3" fill="#95A5A6"/>
    <text x="220" y="50" fill="#D4D4D4" font-size="11" font-family="Arial, sans-serif">Local #95A5A6</text>
    <!-- Custom -->
    <rect x="370" y="38" width="24" height="14" rx="3" fill="#9B59B6"/>
    <text x="400" y="50" fill="#D4D4D4" font-size="11" font-family="Arial, sans-serif">Custom (UAT) #9B59B6</text>

    <text x="0" y="78" fill="#5C6370" font-size="10" font-family="Arial, sans-serif">Active tab = bright color | Inactive tab = darker shade | Status bar = full color</text>
    <text x="0" y="92" fill="#5C6370" font-size="10" font-family="Arial, sans-serif">Gradient option: lighter at top, darker at bottom (toggle in settings)</text>
  </g>
</svg>