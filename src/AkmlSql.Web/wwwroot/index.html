<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AKML SQL — Web edition</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!--
        Theme CSS: light.css is the default the link starts with; the classic script straight after it
        (spec 041 R54) points the link at the remembered theme before the first paint, so the page never
        flashes the wrong theme. akml-theme.js takes over once Blazor starts.
    -->
    <link id="akml-theme-css" rel="stylesheet" href="css/themes/light.css" />
    <!-- External (not inline) so the CSP script-src needs no 'unsafe-inline'/hash; classic and synchronous
         (not a module, which is deferred). See js/akml-theme-boot.js. -->
    <script src="js/akml-theme-boot.js"></script>
    <!-- Global base + focus rings (token-driven). Loaded AFTER the theme link so it can
         reference the --akml-* custom properties whichever variant is active. -->
    <link rel="stylesheet" href="css/app.css" />
</head>
<body>
    <!-- Spec 041 (T205, R66, FR-088): the start-up and crash screens, styled by tokens in css/app.css (no inline
         styles). Blazor replaces #app's content once it starts, and shows #blazor-error-ui on an unhandled error. -->
    <div id="app">
        <div class="akml-boot" role="status">
            <span class="akml-boot-spinner" aria-hidden="true"></span>
            <p class="akml-boot-title">AKML SQL</p>
            <p class="akml-boot-text">Loading the web edition…</p>
        </div>
    </div>

    <div id="blazor-error-ui" class="akml-crash" role="alert">
        Something went wrong. Reload the page to try again.
        <a href="" class="reload">Reload</a>
    </div>

    <!-- Wake signals for the engine auto-connect loop. Loaded before Blazor so the global exists
         by the time MainLayout's first render calls akmlEngineWake.register. -->
    <script src="js/akml-engine-wake.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
